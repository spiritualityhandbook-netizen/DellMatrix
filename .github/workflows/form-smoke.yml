name: Form smoke

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Canonical regression (offline; 4 CI entries + 17 *_test suites + core_ii_smoke)
        run: |
          python -m form.regress --twice
          python -m form.regress --order rev
