<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DellMatrix · Geometry</title>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div id="app">
  <div class="page">
    <div class="sync-strip" id="sync-strip" aria-live="polite"><span class="dot"></span> <span id="sync-text">syncing…</span></div>

    <div class="page-head">
      <div>
        <h1>Sacred Geometry</h1>
        <p class="lede">Flower of Life, Verita, Voynich rings (structural only — not a decode), fractals. Keys: <kbd>F</kbd> flower · <kbd>V</kbd> verita</p>
      </div>
      <div class="toolbar">
        <button title="geometry" type="button" class="primary" data-cmd="geometry">Geometry</button>
        <button title="cube" type="button" data-cmd="cube">Cube</button>
        <button title="sphere" type="button" data-cmd="sphere">Sphere</button>
        <button title="core" type="button" data-cmd="core">Core</button>
        <button title="flower" type="button" data-cmd="flower">Flower</button>
        <button title="toggle" type="button" data-cmd="toggle">Dual</button>
        <button title="verita" type="button" data-cmd="verita">Verita</button>
        <button title="voynich" type="button" data-cmd="voynich">Voynich</button>
        <button title="fractal" type="button" data-cmd="fractal">Fractals</button>
        <a href="/lattice"><button type="button" class="sm">Lattice</button></a>
      </div>
    </div>
    <div class="grid-3">
      <div class="card"><h3>Form / FoL</h3><div class="stat" id="form">—</div></div>
      <div class="card"><h3>Voynich rings (inspire)</h3><div class="stat" id="voy">—</div></div>
      <div class="card"><h3>Verita edges</h3><div class="stat" id="ver">—</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h3>Geometry output</h3>
      <pre id="out" class="mono-out">—</pre>
    </div>
  
    <nav class="row" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)" aria-label="All pages" data-navhub="geometry">
      <a href="/"><button type="button" class="sm" title="Menu">Menu</button></a>
      <a href="/walk"><button type="button" class="sm" title="Walk">Walk</button></a>
      <a href="/lattice"><button type="button" class="sm" title="Lattice">Lattice</button></a>
      <a href="/nursery"><button type="button" class="sm" title="Nursery">Nursery</button></a>
      <a href="/program"><button type="button" class="sm" title="Program">Program</button></a>
      <a href="/personas"><button type="button" class="sm" title="Personas">Personas</button></a>
      <a href="/forces"><button type="button" class="sm" title="Forces">Forces</button></a>
      <a href="/geometry"><button type="button" class="sm" title="Geometry">Geometry</button></a>
      <a href="/matrices"><button type="button" class="sm" title="Matrices">Matrices</button></a>
      <a href="/console"><button type="button" class="sm" title="Console">Console</button></a>
    </nav><!-- btnpath:navhub:geometry -->
</div>
</div>
<script src="/js/core.js"></script>
<script>
(function(){
  const shell=DM.mountShell({page:'geometry'});
  const $=id=>document.getElementById(id);
  async function paint(){
    const s=await DM.getState();
    document.title=`DellMatrix · Geometry · ${s.form||'?'}`;
    shell.setMeta(`geometry · form ${s.form||'?'}`);
    shell.setFoot(s);
    try{ var _sx=document.getElementById('sync-text'); if(_sx&&DM.formatSyncLine){ var _st=(typeof s!=='undefined'?s:(typeof STATE!=='undefined'?STATE:null)); if(_st) _sx.textContent=DM.formatSyncLine(_st); } }catch(_e){}
    /* syncux:sync-strip-geometry */

    const fg=s.flower_geometry||{}, v=s.voynich||{}, edges=s.verita_edges||[];
    $('form').innerHTML=`form <b>${DM.esc(s.form||'?')}</b><br>FoL centers ${fg.center_count??'—'} · vesicas ${fg.vesica_count??'—'}`;
    $('voy').innerHTML=`<pre class="mono-out" style="max-height:140px">${DM.esc(JSON.stringify(v,null,2).slice(0,800))}</pre>`;
    $('ver').innerHTML=`edges in state sample: ${edges.length}<br><pre class="mono-out" style="max-height:120px">${DM.esc(JSON.stringify(edges.slice(0,5),null,2))}</pre>`;
  }
  async function run(cmd){
    const r=await DM.sendCmd(cmd);
    $('out').textContent=r&&(r.msg||r.error)||'—';
    await paint();
  }
  document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>run(b.getAttribute('data-cmd')));
  window.addEventListener('keydown',e=>{
    if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
    if(e.key==='f'){ e.preventDefault(); run('flower'); }
    if(e.key==='v'){ e.preventDefault(); run('verita'); }
  });
  paint();
  run('geometry');
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') paint().catch(()=>{}); });
})();
</script>
<!-- btnpath:titles:geometry -->
<!-- syncux:empty-geometry -->
<!-- syncux:kbdhelp-geometry -->
</body>
</html>
