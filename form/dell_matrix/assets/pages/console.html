<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DellMatrix · Console</title>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div id="app">
  <div class="page">
    <div class="sync-strip" id="sync-strip" aria-live="polite"><span class="dot"></span> <span id="sync-text">syncing…</span></div>

    <div class="page-head">
      <div>
        <h1>Console</h1>
        <p class="lede">Mandell seeds and English intents — full result sheet and history. Every command returns a useful end message.</p>
      </div>
      <div class="toolbar" id="quick">
        <button type="button" class="sm" data-fill="status" title="status">status</button>
        <button type="button" class="sm" data-fill="home" title="home">home</button>
        <button type="button" class="sm" data-fill="nearest" title="nearest">nearest</button>
        <button type="button" class="sm" data-fill="look" title="look">look</button>
        <button type="button" class="sm" data-fill="page" title="idea page">page</button>
        <button type="button" class="sm" data-fill="grow ideas 1" title="grow">grow</button>
        <button type="button" class="sm" data-fill="proposals" title="proposals">proposals</button>
        <button type="button" class="sm" data-fill="rank" title="rank">rank</button>
        <button type="button" class="sm" data-fill="audit" title="audit">audit</button>
        <button type="button" class="sm" data-fill="inspire" title="inspire">inspire</button>
        <button type="button" class="sm" data-fill="workshops" title="workshops">workshops</button>
        <button type="button" class="sm" data-fill="save" title="save">save</button>
      </div>
    </div>
    <div class="cmdbar" style="margin-bottom:12px">
      <input id="cmd" class="field mono" placeholder="create an idea called Name · grow ideas 2 · look · page · plant Label · 08[Create] > 15[Map] :: x" autocomplete="off" spellcheck="false"/>
      <button type="button" class="primary" id="go">Run</button>
      <button type="button" class="ghost sm" id="clear" title="Clear result">Clear</button>
    </div>
    <div class="grid-2">
      <div class="card">
        <h3>Result sheet</h3>
        <pre id="out" class="mono-out" style="min-height:40vh">—</pre>
      </div>
      <div class="card">
        <h3>Command history</h3>
        <div class="list" id="hist"></div>
        <div class="stat" style="margin-top:10px" id="pos">—</div>
        <div class="row" style="margin-top:8px">
          <a href="/walk"><button type="button" class="sm">Walk</button></a>
          <a href="/nursery"><button type="button" class="sm">Nursery</button></a>
          <a href="/lattice"><button type="button" class="sm">Lattice</button></a>
          <a href="/inspire"><button type="button" class="sm">Inspire</button></a>
        </div>
      </div>
    </div>

    <nav class="row" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)" aria-label="All pages" data-navhub="console">
      <a href="/"><button type="button" class="sm">Menu</button></a>
      <a href="/walk"><button type="button" class="sm">Walk</button></a>
      <a href="/lattice"><button type="button" class="sm">Lattice</button></a>
      <a href="/nursery"><button type="button" class="sm">Nursery</button></a>
      <a href="/program"><button type="button" class="sm">Program</button></a>
      <a href="/personas"><button type="button" class="sm">Personas</button></a>
      <a href="/forces"><button type="button" class="sm">Forces</button></a>
      <a href="/geometry"><button type="button" class="sm">Geometry</button></a>
      <a href="/matrices"><button type="button" class="sm">Matrices</button></a>
      <a href="/workshops"><button type="button" class="sm">Workshops</button></a>
      <a href="/inspire"><button type="button" class="sm">Inspire</button></a>
      <a href="/console"><button type="button" class="sm primary">Console</button></a>
    </nav>
  </div>
</div>
<script src="/js/core.js"></script>
<script>
(function(){
  const shell=DM.mountShell({page:'console'});
  const $=id=>document.getElementById(id);

  async function paint(){
    const s=await DM.getState();
    const fp=s.fp||{}, c=fp.center||[0,0,0];
    shell.setMeta(`console · @ (${c.join(',')}) · hist ${(s.cmd_history||[]).length}`);
    shell.setFoot(s);
    try{ var _sx=document.getElementById('sync-text'); if(_sx&&DM.formatSyncLine){ _sx.textContent=DM.formatSyncLine(s); } }catch(_e){}
    $('pos').innerHTML=`center <b>(${c.join(',')})</b> face ${DM.esc(fp.yaw||'N')}<br><span style="color:#7ddea8">${DM.esc(fp.mandel||'')}</span>`;
    const h=s.cmd_history||[];
    $('hist').innerHTML=h.length? h.slice().reverse().map(c=>
      `<button type="button" class="list-item" data-rerun="${DM.esc(c)}"><div class="t">${DM.esc(c)}</div></button>`
    ).join('') : '<div class="empty">No commands yet — try grow, look, page, or plant</div>';
    document.querySelectorAll('[data-rerun]').forEach(b=>{
      b.onclick=()=>{ $('cmd').value=b.getAttribute('data-rerun'); run(); };
    });
  }

  async function run(){
    const c=$('cmd').value.trim();
    if(!c){
      $('out').textContent='Empty — try: help | page | look | proposals | create an idea called Name';
      return;
    }
    const r=await DM.sendCmd(c);
    const body=(r.msg||r.error||'').trim() || (r.ok?'Done.':'Failed.');
    $('out').textContent=body.slice(0,8000);
    paint();
  }

  $('go').onclick=run;
  $('cmd').addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  $('clear').onclick=()=>{ $('out').textContent='—'; };
  document.querySelectorAll('[data-fill]').forEach(b=>{
    b.onclick=()=>{ $('cmd').value=b.getAttribute('data-fill'); run(); };
  });

  paint();
  setInterval(paint, 5000);
})();
</script>
</body>
</html>
